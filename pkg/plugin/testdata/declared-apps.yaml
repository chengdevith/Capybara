# Test fixture: the declared Application objects, policy and actions the
# GitOps plugin had before Argo CD's own UI replaced Capybara's pages. It
# keeps the framework's delete modes, action inputs, confirmation, policy
# placeholders and requiresStep covered end to end through the Object and
# Action APIs (argocd_test.go).
name: argocd
displayName: GitOps
version: 0.1.0
extensionApi: 1
scope: per-cluster
modes: [connect]
permissions:
  console:
    clusterRules:
      - apiGroups: [argoproj.io]
        resources: [applications, appprojects]
        verbs: [get, list, watch]
      - apiGroups: [argoproj.io]
        resources: [argocds]
        verbs: [get, list]
  # Writes, only in Project namespaces (ClusterRole
  # capybara-plugin-argocd-project, bound in each Project namespace), and
  # one AppProject per Project in Argo CD's namespace.
  project:
    rules:
      - apiGroups: [argoproj.io]
        resources: [applications]
        verbs: [create, update, patch, delete]
objects:
  - name: applications
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    verbs: [create, update, delete]
    policy: application
    requiresStep: apps-in-any-namespace
    # Deleting an Application: with the resources it deployed (Argo CD's
    # cascade finalizer), or the Application only (they stay).
    deleteModes:
      - name: cascade
        title: Delete the Application and the resources it deployed
        ensureFinalizers: [resources-finalizer.argocd.argoproj.io]
      - name: app-only
        title: Delete the Application only (deployed resources stay)
        removeFinalizers:
          - resources-finalizer.argocd.argoproj.io
          - resources-finalizer.argocd.argoproj.io/background
          - resources-finalizer.argocd.argoproj.io/foreground

policies:
  application:
    rules:
      # Its Project's own Argo CD project, deploying only into its own
      # namespace on this cluster.
      - {path: spec.project, default: "capybara-{{project}}"}
      - {path: spec.project, allow: ["capybara-{{project}}"], message: "Applications use their Project's Argo CD project (capybara-{{project}})"}
      - {path: spec.destination.server, default: "https://kubernetes.default.svc"}
      - {path: spec.destination.server, allow: ["https://kubernetes.default.svc"], message: "Applications deploy to this cluster only"}
      - {path: spec.destination.name, deny: true, message: "name the destination by server (this cluster), not by name"}
      - {path: spec.destination.namespace, default: "{{namespace}}"}
      - {path: spec.destination.namespace, allow: ["{{namespace}}"], message: "Applications deploy only into their Project's namespace ({{namespace}})"}
      # One source (rollback and history assume it).
      - {path: spec.sources, deny: true, message: "multiple sources are not supported yet; use spec.source"}
      - {path: spec.sourceHydrator, deny: true, message: "source hydration is not supported"}
      # https:// anywhere; http:// and git:// only to in-cluster services.
      - path: spec.source.repoURL
        match: '^(https://[^\s]+|(http|git)://[a-z0-9]([-a-z0-9.]*[a-z0-9])?\.svc(\.cluster\.local)?(:[0-9]+)?(/[^\s]*)?)$'
        message: "repository URLs must be https://, or http:// or git:// to a service in this cluster (*.svc); no SSH"
      - {path: spec.source.plugin, deny: true, message: "config management plugins are not allowed"}
      # The namespace stays the Project's: never created or relabelled.
      - {path: spec.syncPolicy.managedNamespaceMetadata, deny: true, message: "an Application may not change its namespace's labels or annotations"}
      - {path: "spec.syncPolicy.syncOptions.*", deny: true, equals: "CreateNamespace=true", message: "the namespace exists (it is the Project's)"}
      # Only Argo CD's own deletion finalizers.
      - path: "metadata.finalizers.*"
        allow:
          - resources-finalizer.argocd.argoproj.io
          - resources-finalizer.argocd.argoproj.io/background
          - resources-finalizer.argocd.argoproj.io/foreground
        message: "only Argo CD's resources finalizer is allowed"
      # Syncs are started by the Sync action, never by writing an operation.
      - {path: operation, deny: true, message: "start a sync with Sync, not by writing an operation"}

# Writes the console may make, only as declared here (core runs them,
# audited as argocd.<action>), only in Project namespaces, and only where
# Argo CD accepts Applications there.
actions:
  - name: refresh
    title: Refresh
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {metadata: {annotations: {argocd.argoproj.io/refresh: normal}}}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  - name: hard-refresh
    title: Hard refresh
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {metadata: {annotations: {argocd.argoproj.io/refresh: hard}}}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  # Sync now (to the target revision, or one given); pruning deletes
  # resources no longer in Git, so it asks for the name.
  - name: sync
    title: Sync
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch:
      operation:
        initiatedBy: {username: "$(user)"}
        sync: {revision: "$(inputs.revision)", prune: "$(inputs.prune)"}
    inputs:
      - {name: revision, title: Revision, type: string, pattern: "[A-Za-z0-9._/+-]{1,200}", optional: true}
      - {name: prune, title: Prune, type: bool}
    confirmName: {input: prune, equals: "true"}
    when: {absent: [operation]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  # "Sync to this revision" from the history: only for single-source
  # Applications without auto-sync (which would undo it), never pruning.
  - name: sync-revision
    title: Sync to this revision
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch:
      operation:
        initiatedBy: {username: "$(user)"}
        sync: {revision: "$(inputs.revision)", prune: false}
    inputs:
      - {name: revision, title: Revision, type: string, pattern: "[A-Za-z0-9._/+-]{1,200}"}
    when: {absent: [operation, spec.syncPolicy.automated, spec.sources]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
    danger: true
  - name: auto-sync-on
    title: Turn on auto-sync
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {prune: false, selfHeal: false}}}}
    when: {absent: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  - name: auto-sync-off
    title: Turn off auto-sync
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: null}}}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  - name: self-heal-on
    title: Turn on self-heal
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {selfHeal: true}}}}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  - name: self-heal-off
    title: Turn off self-heal
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {selfHeal: false}}}}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  # Auto-prune deletes resources removed from Git on every sync.
  - name: auto-prune-on
    title: Turn on auto-prune
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {prune: true}}}}
    confirmName: {}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
    danger: true
  - name: auto-prune-off
    title: Turn off auto-prune
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {prune: false}}}}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace

# Uninstalling Argo CD while Applications exist would orphan them (and a
# later CRD removal would delete them, cascading into what they deployed).
steps:
  - name: api
    title: Applications API served
    check: {type: apiResource, name: argoproj.io/applications}
  - name: apps-in-any-namespace
    title: Applications in Project namespaces
    informational: true
    check:
      type: field
      fields:
        - {version: v1, resource: configmaps, name: argocd-cmd-params-cm, path: 'data.application\.namespaces', contains: "*"}
