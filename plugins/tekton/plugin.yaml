# Pipelines (id: tekton): Tekton Pipelines, installed from the vendored
# upstream release, or connected to a Tekton already in the cluster.
# Tasks, Pipelines and runs can be created, edited and started in Project
# namespaces, within the guardrails below (ADR 0008); no Git, registry or
# credential management before Phase 5.
name: tekton
displayName: Pipelines
version: 0.2.0
description: >-
  Tekton Pipelines: create and edit Tasks and Pipelines, start runs from a
  form, and follow PipelineRuns and TaskRuns with a graph and step logs, in
  Project namespaces; rerun or cancel a run; the latest runs on each
  Project. Installs Tekton
  Pipelines v1.17.0 (only the cluster resolver enabled), or connects to a
  Tekton already in the cluster (on OpenShift: OpenShift Pipelines; never
  install a second one there).
icon: icon.svg
extensionApi: 1
# Uses the YAML editor and diff, and pluginObjects (1.2).
minExtensionApi: "1.2"
scope: per-cluster
modes: [install, connect]
extensionPoints: [nav-section, nav-item, route, resource-detail-tab, resource-action, project-overview-card]

chart:
  # Built from upstream/release-v1.17.0.yaml by cmd/plugin-chart
  # (make plugin-chart PLUGIN=tekton; make lint checks it reproduces).
  archive: chart/tekton-pipelines-1.17.0.tgz
  sha256: 9e97634219e7ea01d45fa207bc2dab0b77f6d710995624f1f3383b00154108b8
  releaseName: capybara-tekton
  # Upstream's namespace (its webhooks and CRD conversion point here).
  namespace: tekton-pipelines
  # What upstream's own Namespace object (dropped from the chart) set.
  namespaceLabels:
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: tekton-pipelines
    pod-security.kubernetes.io/enforce: restricted
  version: 1.17.0
  # OpenShift ships OpenShift Pipelines: connect to it instead.
  refuseInstallOn: [openshift]

ui:
  bundle: ui/dist/tekton.js
  sha256: 38186cd4db6c235a53d1690826b9e9375f5e04cb34d93eb2dd4a9228c50db36d

# An existing Tekton: connect needs one of these served; install is refused
# when a CRD here belongs to another install, or a namespace exists.
detect:
  apiResources: [tekton.dev/pipelineruns, operator.tekton.dev/tektonconfigs]
  namespaces: [openshift-pipelines]

permissions:
  # Installer credential, install mode: everything the chart creates
  # (checked against a render before installing) and Helm's release
  # Secrets. escalate/bind: Tekton's ClusterRoles grant permissions the
  # installer does not hold itself (pods, secrets, leases, ...).
  install:
    clusterRules:
      # delete: the chart creates tekton-pipelines-resolvers.
      - apiGroups: [""]
        resources: [namespaces]
        verbs: [get, list, watch, create, patch, delete]
      - apiGroups: [""]
        resources: [services, configmaps, secrets, serviceaccounts]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apps]
        resources: [deployments]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: [get, list, watch]
      - apiGroups: [autoscaling]
        resources: [horizontalpodautoscalers]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [get, list, watch, create, update, patch, delete]
      # Read only: uninstall's CRD scan lists the objects of each Tekton
      # kind before you choose to remove the CRDs.
      - apiGroups: [tekton.dev, resolution.tekton.dev]
        resources: ["*"]
        verbs: [get, list, watch]
      - apiGroups: [admissionregistration.k8s.io]
        resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles, clusterrolebindings, roles, rolebindings]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles, roles]
        verbs: [escalate, bind]
  # Connect mode needs nothing beyond the console grant below (Capybara
  # adds creating that ClusterRole and binding, and holding what it grants).
  connect: {}
  # Granted to Capybara's own account on the cluster while the plugin is
  # installed (ClusterRole capybara-plugin-tekton-console): reading only.
  console:
    clusterRules:
      - apiGroups: [tekton.dev]
        resources: [pipelines, pipelineruns, tasks, taskruns, customruns, stepactions]
        verbs: [get, list, watch]
  # Writes, only in Project namespaces: a ClusterRole
  # capybara-plugin-tekton-project bound to Capybara's account by a
  # RoleBinding in each Project namespace, plus the Project's "pipeline"
  # ServiceAccount (no permissions, no API token) that every run started
  # from Capybara uses. Creating a PipelineRun could otherwise use any
  # ServiceAccount in the namespace (Tekton does not check that the creator
  # may); the run policy below pins it. See ADR 0008.
  project:
    rules:
      - apiGroups: [tekton.dev]
        resources: [tasks, pipelines]
        verbs: [create, update, delete]
      - apiGroups: [tekton.dev]
        resources: [pipelineruns]
        verbs: [create, patch, delete]
      - apiGroups: [tekton.dev]
        resources: [taskruns]
        verbs: [create, delete]
    serviceAccounts:
      - name: pipeline

# Kinds the console may write in Project namespaces. Core validates every
# write against the named policy, dry-runs it, and audits it as
# tekton.<verb> (creating a PipelineRun: tekton.start).
objects:
  - name: tasks
    group: tekton.dev
    version: v1
    resource: tasks
    kind: Task
    verbs: [create, update, delete]
    policy: workload
  - name: pipelines
    group: tekton.dev
    version: v1
    resource: pipelines
    kind: Pipeline
    verbs: [create, update, delete]
    policy: workload
    references:
      - {path: "spec.tasks.*.taskRef.name", object: tasks}
      - {path: "spec.finally.*.taskRef.name", object: tasks}
  - name: pipelineruns
    group: tekton.dev
    version: v1
    resource: pipelineruns
    kind: PipelineRun
    verbs: [create, delete]
    policy: run
    audit: {create: start}
    # "Clean up runs": keep the newest finished runs per Pipeline.
    cleanup: {groupLabel: tekton.dev/pipeline, finishedCondition: Succeeded}
    # Starting a run checks the Pipeline and its Tasks as they are now
    # (they may have been changed outside Capybara).
    references:
      - {path: "spec.pipelineRef.name", object: pipelines}
  # A Task run on its own (Create TaskRun), with the same guardrails.
  - name: taskruns
    group: tekton.dev
    version: v1
    resource: taskruns
    kind: TaskRun
    verbs: [create, delete]
    policy: taskrun
    audit: {create: start}
    references:
      - {path: "spec.taskRef.name", object: tasks}

# The guardrails (ADR 0008). "**" matches at any depth, so inline taskSpec
# and pipelineSpec are covered as well.
policies:
  # Tasks, Pipelines, and every task or pipeline spec inside a run.
  workload:
    rules:
      # No Secrets read through the environment: steps, the step template,
      # sidecars.
      - {path: "**.steps.*.env.*.valueFrom.secretKeyRef", deny: true, message: "steps may not read Secrets (secretKeyRef)"}
      - {path: "**.steps.*.envFrom.*.secretRef", deny: true, message: "steps may not read Secrets (envFrom)"}
      - {path: "**.stepTemplate.env.*.valueFrom.secretKeyRef", deny: true, message: "the step template may not read Secrets (secretKeyRef)"}
      - {path: "**.stepTemplate.envFrom.*.secretRef", deny: true, message: "the step template may not read Secrets (envFrom)"}
      - {path: "**.sidecars.*.env.*.valueFrom.secretKeyRef", deny: true, message: "sidecars may not read Secrets (secretKeyRef)"}
      - {path: "**.sidecars.*.envFrom.*.secretRef", deny: true, message: "sidecars may not read Secrets (envFrom)"}
      # Security settings beyond Pod Security "baseline": steps, the step
      # template, sidecars.
      - {path: "**.steps.*.securityContext.privileged", deny: true, equals: "true", message: "privileged steps are not allowed"}
      - {path: "**.steps.*.securityContext.capabilities.add", deny: true, message: "steps may not add capabilities"}
      - {path: "**.stepTemplate.securityContext.privileged", deny: true, equals: "true", message: "a privileged step template is not allowed"}
      - {path: "**.stepTemplate.securityContext.capabilities.add", deny: true, message: "the step template may not add capabilities"}
      - {path: "**.sidecars.*.securityContext.privileged", deny: true, equals: "true", message: "privileged sidecars are not allowed"}
      - {path: "**.sidecars.*.securityContext.capabilities.add", deny: true, message: "sidecars may not add capabilities"}
      - {path: "**.sidecars.*.ports.*.hostPort", deny: true, message: "sidecars may not use host ports"}
      # Task volumes (steps and sidecars mount these), in a Task and in
      # inline task specs: no Secrets, projected tokens or host paths.
      - path: "spec.volumes.*"
        allowKeys: [name]
        exactlyOneOf: [emptyDir, configMap, persistentVolumeClaim]
        message: "volumes may only be emptyDir, configMap or persistentVolumeClaim (no Secrets, projected or host volumes)"
      - path: "**.taskSpec.volumes.*"
        allowKeys: [name]
        exactlyOneOf: [emptyDir, configMap, persistentVolumeClaim]
        message: "volumes may only be emptyDir, configMap or persistentVolumeClaim (no Secrets, projected or host volumes)"
      # StepActions are not supported yet (simpler than validating them).
      - {path: "**.steps.*.ref", deny: true, message: "StepAction references (step ref) are not supported yet"}
      # Only Tasks and Pipelines in the same namespace, by name.
      - {path: "**.taskRef.resolver", deny: true, message: "remote resolvers are not allowed; name a Task in this namespace"}
      - {path: "**.taskRef.params", deny: true, message: "remote resolvers are not allowed; name a Task in this namespace"}
      - {path: "**.taskRef.bundle", deny: true, message: "bundles are not allowed; name a Task in this namespace"}
      - {path: "**.taskRef.apiVersion", deny: true, message: "custom tasks are not allowed"}
      - {path: "**.taskRef.kind", allow: [Task], message: "only Tasks (kind: Task)"}
      - {path: "**.pipelineRef.resolver", deny: true, message: "remote resolvers are not allowed; name a Pipeline in this namespace"}
      - {path: "**.pipelineRef.params", deny: true, message: "remote resolvers are not allowed; name a Pipeline in this namespace"}
      - {path: "**.pipelineRef.bundle", deny: true, message: "bundles are not allowed; name a Pipeline in this namespace"}
  # TaskRuns started from Capybara: the same rules as PipelineRuns, at a
  # TaskRun's own fields.
  taskrun:
    include: [workload]
    rules:
      - {path: spec.serviceAccountName, default: pipeline}
      - {path: spec.serviceAccountName, allow: [pipeline], message: "runs started from Capybara use the Project's pipeline ServiceAccount"}
      - path: "**.podTemplate.volumes.*"
        allowKeys: [name]
        exactlyOneOf: [emptyDir, configMap, persistentVolumeClaim]
        message: "pod template volumes may only be emptyDir, configMap or persistentVolumeClaim (no Secrets)"
      - {path: "**.podTemplate.env.*.valueFrom.secretKeyRef", deny: true, message: "the pod template may not read Secrets"}
      - {path: "**.podTemplate.imagePullSecrets", deny: true, message: "image pull Secrets are not allowed"}
      - {path: "**.podTemplate.hostNetwork", deny: true, equals: "true", message: "host network is not allowed"}
      - path: "spec.workspaces.*"
        allowKeys: [name, subPath]
        exactlyOneOf: [emptyDir, volumeClaimTemplate, configMap]
        message: "workspaces may only be emptyDir, a volumeClaimTemplate or a configMap (no Secrets)"
      - {path: "spec.workspaces.*.volumeClaimTemplate.spec.resources.requests.storage", withinQuota: requests.storage, message: "the volume claims exceed the Project's storage quota"}
      - {path: "spec.workspaces.*.volumeClaimTemplate", countQuota: persistentvolumeclaims, message: "too many volume claims for the Project's quota"}
      # Started straight away (no pending, cancelled or stopped runs).
      - {path: spec.status, deny: true, message: "a run is started, not created pending, stopped or cancelled"}
  # PipelineRuns started (or rerun) from Capybara.
  run:
    include: [workload]
    rules:
      # Always the Project's "pipeline" ServiceAccount.
      - {path: spec.taskRunTemplate.serviceAccountName, default: pipeline}
      - {path: spec.taskRunTemplate.serviceAccountName, allow: [pipeline], message: "runs started from Capybara use the Project's pipeline ServiceAccount"}
      - {path: "spec.taskRunSpecs.*.serviceAccountName", allow: [pipeline], message: "runs started from Capybara use the Project's pipeline ServiceAccount"}
      # Pod templates: no Secret volumes or environment, no host network,
      # no image pull Secrets.
      - path: "**.podTemplate.volumes.*"
        allowKeys: [name]
        exactlyOneOf: [emptyDir, configMap, persistentVolumeClaim]
        message: "pod template volumes may only be emptyDir, configMap or persistentVolumeClaim (no Secrets)"
      - {path: "**.podTemplate.env.*.valueFrom.secretKeyRef", deny: true, message: "the pod template may not read Secrets"}
      - {path: "**.podTemplate.imagePullSecrets", deny: true, message: "image pull Secrets are not allowed"}
      - {path: "**.podTemplate.hostNetwork", deny: true, equals: "true", message: "host network is not allowed"}
      # Workspaces: emptyDir, a volume claim within the Project's quota, or
      # a ConfigMap; never a Secret.
      - path: "spec.workspaces.*"
        allowKeys: [name, subPath]
        exactlyOneOf: [emptyDir, volumeClaimTemplate, configMap]
        message: "workspaces may only be emptyDir, a volumeClaimTemplate or a configMap (no Secrets)"
      - {path: "spec.workspaces.*.volumeClaimTemplate.spec.resources.requests.storage", withinQuota: requests.storage, message: "the volume claims exceed the Project's storage quota"}
      - {path: "spec.workspaces.*.volumeClaimTemplate", countQuota: persistentvolumeclaims, message: "too many volume claims for the Project's quota"}
      # Started straight away (no pending, cancelled or stopped runs).
      - {path: spec.status, deny: true, message: "a run is started, not created pending, stopped or cancelled"}

# Writes the console may make, only as declared here (core runs them,
# audited as tekton.<action>).
actions:
  - name: rerun
    title: Rerun
    group: tekton.dev
    version: v1
    resource: pipelineruns
    kind: PipelineRun
    type: copy
    # Only in Project namespaces, and the copy must pass the run policy (a
    # run naming another ServiceAccount is refused: start a new one).
    projectOnly: true
    policy: run
    # A new run of the same pipeline (an inline pipelineSpec only when the
    # original had one); never its status or cancel state.
    copyFields: [spec.pipelineRef, spec.pipelineSpec, spec.params, spec.workspaces, spec.taskRunTemplate, spec.timeouts]
  - name: cancel
    title: Cancel
    group: tekton.dev
    version: v1
    resource: pipelineruns
    kind: PipelineRun
    type: patch
    patch: {spec: {status: Cancelled}}
    when: {type: Succeeded, status: [Unknown]}
    projectOnly: true
  # Stop: no new tasks start; running ones and finally tasks complete.
  - name: stop
    title: Stop
    group: tekton.dev
    version: v1
    resource: pipelineruns
    kind: PipelineRun
    type: patch
    patch: {spec: {status: StoppedRunFinally}}
    when: {type: Succeeded, status: [Unknown]}
    projectOnly: true
    danger: true

steps:
  - name: chart
    title: Chart installing
    modes: [install]
    check:
      type: helm
  - name: api
    title: Pipelines API served
    check:
      type: apiResource
      name: tekton.dev/pipelineruns
  - name: controller
    title: Controller ready
    modes: [install]
    check:
      type: workload
      kind: Deployment
      name: tekton-pipelines-controller
  - name: webhook
    title: Webhook ready
    modes: [install]
    check:
      type: workload
      kind: Deployment
      name: tekton-pipelines-webhook
  - name: resolvers
    title: Resolvers ready
    modes: [install]
    check:
      type: workload
      kind: Deployment
      name: tekton-pipelines-remote-resolvers
      namespace: tekton-pipelines-resolvers
