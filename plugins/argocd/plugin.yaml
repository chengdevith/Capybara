# GitOps (id: argocd): Argo CD, installed from the vendored argo-cd chart
# (with its own web UI, opened from the console's tools launcher) or
# connected to an Argo CD already in the cluster (on OpenShift: OpenShift
# GitOps; never install a second one there). Each Project gets its own
# Argo CD project limited to its namespace. See ADR 0009.
name: argocd
displayName: GitOps
version: 0.2.0
description: >-
  Argo CD with its own web UI, opened from the tools launcher in the top
  bar. Each Project gets its own Argo CD project limited to its namespace,
  with no cluster-wide kinds and no changes to its quota, limits, network
  policies or role bindings. Installs Argo CD v3.5.4 (no Dex, notifications
  or ApplicationSets; log in as admin until Phase 5), or connects to an
  existing Argo CD (its UI address can be given).
icon: icon.svg
extensionApi: 1
scope: per-cluster
modes: [install, connect]

chart:
  archive: chart/argo-cd-10.10.1.tgz
  sha256: 43d5d21282c90071001c145108831f71ff0172eb5dfe1b6bd06137409d8f6c5e
  values: chart/values-small.yaml
  releaseName: capybara-argocd
  namespace: argocd
  namespaceLabels:
    pod-security.kubernetes.io/enforce: restricted
  version: 10.10.1
  # OpenShift ships OpenShift GitOps: connect to it instead.
  refuseInstallOn: [openshift]
  # Redis's password, made before the chart installs (never in values,
  # the installation or audit entries).
  generatedSecrets:
    - name: argocd-redis
      keys:
        - name: auth
          random: true
  # Argo CD's UI answers under the path Capybara serves it at (one per
  # cluster); a proxy for reaching Git servers, if the cluster needs one.
  installValues:
    configs:
      params:
        server.rootpath: "/api/plugins/argocd/tools/argocd/{{cluster}}"
        server.basehref: "/api/plugins/argocd/tools/argocd/{{cluster}}"
    repoServer:
      env:
        - {name: HTTP_PROXY, value: "{{config.httpProxy}}"}
        - {name: HTTPS_PROXY, value: "{{config.httpsProxy}}"}
        - {name: NO_PROXY, value: "{{config.noProxy}}"}

# An existing Argo CD: connect needs Applications served; install is refused
# when its CRDs belong to another install, or OpenShift GitOps' namespace
# exists.
detect:
  apiResources: [argoproj.io/applications, argoproj.io/argocds]
  namespaces: [openshift-gitops]

config:
  schema:
    type: object
    properties:
      namespace:
        type: string
        title: Argo CD namespace
        description: "Connect: the namespace Argo CD runs in (argocd, or openshift-gitops on OpenShift)."
        default: argocd
        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      httpProxy:
        type: string
        title: HTTP proxy
        description: "Install: proxy for http:// Git servers (empty: none)."
        pattern: "^(https?://[^\\s]+)?$"
      httpsProxy:
        type: string
        title: HTTPS proxy
        description: "Install: proxy for https:// Git servers (empty: none)."
        pattern: "^(https?://[^\\s]+)?$"
      noProxy:
        type: string
        title: No proxy
        description: "Install: hosts reached directly, comma-separated."
        pattern: "^[^\\s]*$"
      uiURL:
        type: string
        title: Argo CD UI address
        description: "Connect: the existing Argo CD's web address (https://…, e.g. the OpenShift GitOps route), for the tools launcher."
        pattern: "^(https://[^\\s]+)?$"

# Generated AppProjects live in Argo CD's namespace.
connectNamespaceKey: namespace

permissions:
  # Installer credential, install mode: everything the chart creates
  # (checked against a render before installing) and Helm's release
  # Secrets. escalate/bind: the application controller's ClusterRole
  # grants what the installer does not hold itself.
  install:
    clusterRules:
      - apiGroups: [""]
        resources: [namespaces]
        verbs: [get, list, watch, create, patch]
      - apiGroups: [""]
        resources: [services, configmaps, secrets, serviceaccounts]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apps]
        resources: [deployments, statefulsets]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apps]
        resources: [replicasets, controllerrevisions]
        verbs: [get, list, watch]
      - apiGroups: [networking.k8s.io]
        resources: [networkpolicies]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [get, list, watch, create, update, patch, delete]
      # The locked "default" AppProject (a chart hook) and the generated
      # capybara-<project> ones; reading every Argo CD kind for the
      # uninstall CRD scan. No permission on ApplicationSets beyond that.
      - apiGroups: [argoproj.io]
        resources: [appprojects]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [argoproj.io]
        resources: [applications, applicationsets]
        verbs: [get, list, watch]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles, clusterrolebindings, roles, rolebindings]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles, roles]
        verbs: [escalate, bind]
  # Connect mode: only the generated AppProjects in Argo CD's namespace
  # (added from permissions.project.objects) and the per-Project access.
  connect: {}
  # Capybara's own account, while the plugin is installed: reading
  # Applications (uninstall safety) and AppProjects, and what the connect
  # check looks at; reaching the argocd-server Service (the UI, added from
  # tools). Never ApplicationSets.
  console:
    clusterRules:
      - apiGroups: [argoproj.io]
        resources: [applications, appprojects]
        verbs: [get, list, watch]
      - apiGroups: [argoproj.io]
        resources: [argocds]
        verbs: [get, list]
  # One Argo CD project per Project, in Argo CD's namespace (no access is
  # granted to Capybara in Projects).
  project:
    objects:
      # The Project's Argo CD project: Applications only from the Project's
      # namespace, deploying only into it, on this cluster; no
      # cluster-scoped kinds; never the Project's quota, limits, network
      # policies or role bindings (Roles and ServiceAccounts are allowed).
      - inPluginNamespace: true
        resource: appprojects
        template:
          apiVersion: argoproj.io/v1alpha1
          kind: AppProject
          metadata:
            name: "capybara-{{project}}"
          spec:
            description: "Capybara Project {{project}} ({{cluster}}): only namespace {{namespace}}."
            sourceRepos: ["*"]
            sourceNamespaces: ["{{namespace}}"]
            destinations:
              - server: https://kubernetes.default.svc
                namespace: "{{namespace}}"
            clusterResourceWhitelist: []
            namespaceResourceBlacklist:
              - {group: "", kind: ResourceQuota}
              - {group: "", kind: LimitRange}
              - {group: networking.k8s.io, kind: NetworkPolicy}
              - {group: rbac.authorization.k8s.io, kind: RoleBinding}

# Uninstalling Argo CD while Applications exist would orphan them (and a
# later CRD removal would delete them, cascading into what they deployed).
uninstallBlockers:
  - group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    flagFinalizer: resources-finalizer.argocd.argoproj.io
    message: >-
      Delete the Applications first (in Argo CD's UI: with or without the
      resources they deployed).

steps:
  - name: chart
    title: Chart installing
    modes: [install]
    check:
      type: helm
  - name: api
    title: Applications API served
    check:
      type: apiResource
      name: argoproj.io/applications
  - name: redis
    title: Redis ready
    modes: [install]
    check:
      type: workload
      kind: Deployment
      name: argocd-redis
  - name: repo-server
    title: Repo server ready
    modes: [install]
    check:
      type: workload
      kind: Deployment
      name: argocd-repo-server
  - name: controller
    title: Application controller ready
    modes: [install]
    check:
      type: workload
      kind: StatefulSet
      name: argocd-application-controller
  - name: server
    title: Web UI ready
    modes: [install]
    check:
      type: workload
      kind: Deployment
      name: argocd-server
  # Whether Argo CD accepts Applications outside its own namespace (so each
  # Project's Applications can live in the Project). Installed: always (the
  # preset sets it).
  - name: apps-in-any-namespace
    title: Applications in Project namespaces
    informational: true
    check:
      type: field
      fields:
        - {version: v1, resource: configmaps, name: argocd-cmd-params-cm, path: 'data.application\.namespaces', contains: "*"}
        - {group: argoproj.io, version: v1beta1, resource: argocds, path: spec.sourceNamespaces, contains: "*"}

# The tools launcher: Argo CD's web UI. Installed: served by Capybara from
# the argocd-server Service (login cookie argocd.token only). Connected:
# the address given in the config, if any.
tools:
  - name: argocd
    title: Argo CD
    icon: argocd
    modes: [install]
    service: {service: argocd-server, port: http}
    cookies: [argocd.token]
  - name: argocd-ui
    title: Argo CD
    icon: argocd
    modes: [connect]
    urlKey: uiURL
