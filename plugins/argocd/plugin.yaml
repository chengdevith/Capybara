# GitOps (id: argocd): Argo CD Applications in Project namespaces,
# installed from the vendored argo-cd chart (controller, repo server and
# Redis; Capybara's console is the UI) or connected to an Argo CD already in
# the cluster (on OpenShift: OpenShift GitOps; never install a second one
# there). See ADR 0009.
name: argocd
displayName: GitOps
version: 0.1.0
description: >-
  Argo CD Applications for each Project: create them from a form or YAML,
  follow sync and health, the deployed resources and the sync history;
  sync, refresh, roll back, and switch auto-sync, self-heal and auto-prune.
  Each Project gets its own Argo CD project limited to its namespace, with
  no cluster-wide kinds and no changes to its quota, limits, network
  policies or role bindings. Installs Argo CD v3.5.4 (no API server, Dex,
  notifications or ApplicationSets), or connects to an existing Argo CD.
icon: icon.svg
extensionApi: 1
# Action inputs and confirmation, delete modes (1.3).
minExtensionApi: "1.3"
scope: per-cluster
modes: [install, connect]
extensionPoints: [nav-section, nav-item, route, resource-detail-tab, resource-action, project-overview-card]

chart:
  archive: chart/argo-cd-10.10.1.tgz
  sha256: 43d5d21282c90071001c145108831f71ff0172eb5dfe1b6bd06137409d8f6c5e
  values: chart/values-small.yaml
  releaseName: capybara-argocd
  namespace: argocd
  namespaceLabels:
    pod-security.kubernetes.io/enforce: restricted
  version: 10.10.1
  # OpenShift ships OpenShift GitOps: connect to it instead.
  refuseInstallOn: [openshift]
  # Redis's password, made before the chart installs (never in values,
  # the installation or audit entries).
  generatedSecrets:
    - name: argocd-redis
      keys:
        - name: auth
          random: true
  # A proxy for reaching Git servers, if the cluster needs one.
  installValues:
    repoServer:
      env:
        - {name: HTTP_PROXY, value: "{{config.httpProxy}}"}
        - {name: HTTPS_PROXY, value: "{{config.httpsProxy}}"}
        - {name: NO_PROXY, value: "{{config.noProxy}}"}

ui:
  bundle: ui/dist/argocd.js
  sha256: 1365bbe56834a4efc5a2ea06f02957f6286a5d11976924f2da27242041f5ebe0

# An existing Argo CD: connect needs Applications served; install is refused
# when its CRDs belong to another install, or OpenShift GitOps' namespace
# exists.
detect:
  apiResources: [argoproj.io/applications, argoproj.io/argocds]
  namespaces: [openshift-gitops]

config:
  schema:
    type: object
    properties:
      namespace:
        type: string
        title: Argo CD namespace
        description: "Connect: the namespace Argo CD runs in (argocd, or openshift-gitops on OpenShift)."
        default: argocd
        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      httpProxy:
        type: string
        title: HTTP proxy
        description: "Install: proxy for http:// Git servers (empty: none)."
        pattern: "^(https?://[^\\s]+)?$"
      httpsProxy:
        type: string
        title: HTTPS proxy
        description: "Install: proxy for https:// Git servers (empty: none)."
        pattern: "^(https?://[^\\s]+)?$"
      noProxy:
        type: string
        title: No proxy
        description: "Install: hosts reached directly, comma-separated."
        pattern: "^[^\\s]*$"

# Generated AppProjects live in Argo CD's namespace.
connectNamespaceKey: namespace

permissions:
  # Installer credential, install mode: everything the chart creates
  # (checked against a render before installing) and Helm's release
  # Secrets. escalate/bind: the application controller's ClusterRole
  # grants what the installer does not hold itself.
  install:
    clusterRules:
      - apiGroups: [""]
        resources: [namespaces]
        verbs: [get, list, watch, create, patch]
      - apiGroups: [""]
        resources: [services, configmaps, secrets, serviceaccounts]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apps]
        resources: [deployments, statefulsets]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apps]
        resources: [replicasets, controllerrevisions]
        verbs: [get, list, watch]
      - apiGroups: [networking.k8s.io]
        resources: [networkpolicies]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [get, list, watch, create, update, patch, delete]
      # The locked "default" AppProject (a chart hook) and the generated
      # capybara-<project> ones; reading every Argo CD kind for the
      # uninstall CRD scan. No permission on ApplicationSets beyond that.
      - apiGroups: [argoproj.io]
        resources: [appprojects]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [argoproj.io]
        resources: [applications, applicationsets]
        verbs: [get, list, watch]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles, clusterrolebindings, roles, rolebindings]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterroles, roles]
        verbs: [escalate, bind]
  # Connect mode: only the generated AppProjects in Argo CD's namespace
  # (added from permissions.project.objects) and the per-Project access.
  connect: {}
  # Capybara's own account, while the plugin is installed: reading
  # Applications and AppProjects, and what the connect checks look at.
  # Never ApplicationSets.
  console:
    clusterRules:
      - apiGroups: [argoproj.io]
        resources: [applications, appprojects]
        verbs: [get, list, watch]
      - apiGroups: [argoproj.io]
        resources: [argocds]
        verbs: [get, list]
  # Writes, only in Project namespaces (ClusterRole
  # capybara-plugin-argocd-project, bound in each Project namespace), and
  # one AppProject per Project in Argo CD's namespace.
  project:
    rules:
      - apiGroups: [argoproj.io]
        resources: [applications]
        verbs: [create, update, patch, delete]
    objects:
      # The Project's Argo CD project: Applications only from the Project's
      # namespace, deploying only into it, on this cluster; no
      # cluster-scoped kinds; never the Project's quota, limits, network
      # policies or role bindings (Roles and ServiceAccounts are allowed).
      - inPluginNamespace: true
        resource: appprojects
        template:
          apiVersion: argoproj.io/v1alpha1
          kind: AppProject
          metadata:
            name: "capybara-{{project}}"
          spec:
            description: "Capybara Project {{project}} ({{cluster}}): only namespace {{namespace}}."
            sourceRepos: ["*"]
            sourceNamespaces: ["{{namespace}}"]
            destinations:
              - server: https://kubernetes.default.svc
                namespace: "{{namespace}}"
            clusterResourceWhitelist: []
            namespaceResourceBlacklist:
              - {group: "", kind: ResourceQuota}
              - {group: "", kind: LimitRange}
              - {group: networking.k8s.io, kind: NetworkPolicy}
              - {group: rbac.authorization.k8s.io, kind: RoleBinding}

# Applications, written only in Project namespaces after the policy below,
# and only where Argo CD accepts them there (step apps-in-any-namespace).
objects:
  - name: applications
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    verbs: [create, update, delete]
    policy: application
    requiresStep: apps-in-any-namespace
    # Deleting an Application: with the resources it deployed (Argo CD's
    # cascade finalizer), or the Application only (they stay).
    deleteModes:
      - name: cascade
        title: Delete the Application and the resources it deployed
        ensureFinalizers: [resources-finalizer.argocd.argoproj.io]
      - name: app-only
        title: Delete the Application only (deployed resources stay)
        removeFinalizers:
          - resources-finalizer.argocd.argoproj.io
          - resources-finalizer.argocd.argoproj.io/background
          - resources-finalizer.argocd.argoproj.io/foreground

policies:
  application:
    rules:
      # Its Project's own Argo CD project, deploying only into its own
      # namespace on this cluster.
      - {path: spec.project, default: "capybara-{{project}}"}
      - {path: spec.project, allow: ["capybara-{{project}}"], message: "Applications use their Project's Argo CD project (capybara-{{project}})"}
      - {path: spec.destination.server, default: "https://kubernetes.default.svc"}
      - {path: spec.destination.server, allow: ["https://kubernetes.default.svc"], message: "Applications deploy to this cluster only"}
      - {path: spec.destination.name, deny: true, message: "name the destination by server (this cluster), not by name"}
      - {path: spec.destination.namespace, default: "{{namespace}}"}
      - {path: spec.destination.namespace, allow: ["{{namespace}}"], message: "Applications deploy only into their Project's namespace ({{namespace}})"}
      # One source (rollback and history assume it).
      - {path: spec.sources, deny: true, message: "multiple sources are not supported yet; use spec.source"}
      - {path: spec.sourceHydrator, deny: true, message: "source hydration is not supported"}
      # https:// anywhere; http:// and git:// only to in-cluster services.
      - path: spec.source.repoURL
        match: '^(https://[^\s]+|(http|git)://[a-z0-9]([-a-z0-9.]*[a-z0-9])?\.svc(\.cluster\.local)?(:[0-9]+)?(/[^\s]*)?)$'
        message: "repository URLs must be https://, or http:// or git:// to a service in this cluster (*.svc); no SSH"
      - {path: spec.source.plugin, deny: true, message: "config management plugins are not allowed"}
      # The namespace stays the Project's: never created or relabelled.
      - {path: spec.syncPolicy.managedNamespaceMetadata, deny: true, message: "an Application may not change its namespace's labels or annotations"}
      - {path: "spec.syncPolicy.syncOptions.*", deny: true, equals: "CreateNamespace=true", message: "the namespace exists (it is the Project's)"}
      # Only Argo CD's own deletion finalizers.
      - path: "metadata.finalizers.*"
        allow:
          - resources-finalizer.argocd.argoproj.io
          - resources-finalizer.argocd.argoproj.io/background
          - resources-finalizer.argocd.argoproj.io/foreground
        message: "only Argo CD's resources finalizer is allowed"
      # Syncs are started by the Sync action, never by writing an operation.
      - {path: operation, deny: true, message: "start a sync with Sync, not by writing an operation"}

# Writes the console may make, only as declared here (core runs them,
# audited as argocd.<action>), only in Project namespaces, and only where
# Argo CD accepts Applications there.
actions:
  - name: refresh
    title: Refresh
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {metadata: {annotations: {argocd.argoproj.io/refresh: normal}}}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  - name: hard-refresh
    title: Hard refresh
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {metadata: {annotations: {argocd.argoproj.io/refresh: hard}}}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  # Sync now (to the target revision, or one given); pruning deletes
  # resources no longer in Git, so it asks for the name.
  - name: sync
    title: Sync
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch:
      operation:
        initiatedBy: {username: "$(user)"}
        sync: {revision: "$(inputs.revision)", prune: "$(inputs.prune)"}
    inputs:
      - {name: revision, title: Revision, type: string, pattern: "[A-Za-z0-9._/+-]{1,200}", optional: true}
      - {name: prune, title: Prune, type: bool}
    confirmName: {input: prune, equals: "true"}
    when: {absent: [operation]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  # "Sync to this revision" from the history: only for single-source
  # Applications without auto-sync (which would undo it), never pruning.
  - name: sync-revision
    title: Sync to this revision
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch:
      operation:
        initiatedBy: {username: "$(user)"}
        sync: {revision: "$(inputs.revision)", prune: false}
    inputs:
      - {name: revision, title: Revision, type: string, pattern: "[A-Za-z0-9._/+-]{1,200}"}
    when: {absent: [operation, spec.syncPolicy.automated, spec.sources]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
    danger: true
  - name: auto-sync-on
    title: Turn on auto-sync
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {prune: false, selfHeal: false}}}}
    when: {absent: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  - name: auto-sync-off
    title: Turn off auto-sync
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: null}}}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  - name: self-heal-on
    title: Turn on self-heal
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {selfHeal: true}}}}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  - name: self-heal-off
    title: Turn off self-heal
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {selfHeal: false}}}}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
  # Auto-prune deletes resources removed from Git on every sync.
  - name: auto-prune-on
    title: Turn on auto-prune
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {prune: true}}}}
    confirmName: {}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace
    danger: true
  - name: auto-prune-off
    title: Turn off auto-prune
    group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    type: patch
    patch: {spec: {syncPolicy: {automated: {prune: false}}}}
    when: {present: [spec.syncPolicy.automated]}
    projectOnly: true
    requiresStep: apps-in-any-namespace

# Uninstalling Argo CD while Applications exist would orphan them (and a
# later CRD removal would delete them, cascading into what they deployed).
uninstallBlockers:
  - group: argoproj.io
    version: v1alpha1
    resource: applications
    kind: Application
    flagFinalizer: resources-finalizer.argocd.argoproj.io
    message: >-
      Delete the Applications first (GitOps > Applications > Delete): either
      with the resources they deployed, or the Application only.

steps:
  - name: chart
    title: Chart installing
    modes: [install]
    check:
      type: helm
  - name: api
    title: Applications API served
    check:
      type: apiResource
      name: argoproj.io/applications
  - name: redis
    title: Redis ready
    modes: [install]
    check:
      type: workload
      kind: Deployment
      name: argocd-redis
  - name: repo-server
    title: Repo server ready
    modes: [install]
    check:
      type: workload
      kind: Deployment
      name: argocd-repo-server
  - name: controller
    title: Application controller ready
    modes: [install]
    check:
      type: workload
      kind: StatefulSet
      name: argocd-application-controller
  # Whether Argo CD accepts Applications outside its own namespace: without
  # it, GitOps is view-only on this cluster (no create, edit, delete, sync
  # or refresh). Installed: always (the preset sets it).
  - name: apps-in-any-namespace
    title: Applications in Project namespaces
    informational: true
    check:
      type: field
      fields:
        - {version: v1, resource: configmaps, name: argocd-cmd-params-cm, path: 'data.application\.namespaces', contains: "*"}
        - {group: argoproj.io, version: v1beta1, resource: argocds, path: spec.sourceNamespaces, contains: "*"}
