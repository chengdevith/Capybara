---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: plugininstallations.platform.capybara.io
spec:
  group: platform.capybara.io
  names:
    kind: PluginInstallation
    listKind: PluginInstallationList
    plural: plugininstallations
    singular: plugininstallation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.plugin
      name: Plugin
      type: string
    - jsonPath: .spec.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentStep
      name: Step
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PluginInstallation is a plugin installed in (or connected to) a cluster.
          Its name is "<plugin>.<cluster>".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PluginInstallationSpec attaches a plugin to one cluster.
            properties:
              cluster:
                type: string
              config:
                description: Config values (non-secret) validated against the plugin's
                  schema.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              connectSecret:
                description: |-
                  ConnectSecret names a Secret (type platform.capybara.io/plugin-connect,
                  in capybara-system) with a bearer token for connect mode.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              enabled:
                description: |-
                  Enabled shows the plugin's UI for this cluster. Disabling keeps
                  everything running.
                type: boolean
              mode:
                description: InstallMode is how a plugin is attached to a cluster.
                enum:
                - install
                - connect
                type: string
              plugin:
                type: string
              version:
                description: Version of the plugin to run; changing it upgrades.
                type: string
            required:
            - cluster
            - enabled
            - mode
            - plugin
            - version
            type: object
          status:
            description: PluginInstallationStatus is the installation's progress and
              health.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentStep:
                description: CurrentStep is the first step not done.
                type: string
              installedVersion:
                description: InstalledVersion is the plugin version last deployed
                  successfully.
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: InstallationPhase summarises an installation.
                enum:
                - Pending
                - Installing
                - Ready
                - Error
                - Disabled
                - Uninstalling
                type: string
              steps:
                items:
                  description: StepStatus is one step's progress.
                  properties:
                    message:
                      type: string
                    name:
                      type: string
                    state:
                      description: StepState is a step's progress.
                      enum:
                      - Pending
                      - Running
                      - Done
                      - Failed
                      type: string
                    title:
                      type: string
                  required:
                  - name
                  - state
                  - title
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
