---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: pluginrepositories.platform.capybara.io
spec:
  group: platform.capybara.io
  names:
    kind: PluginRepository
    listKind: PluginRepositoryList
    plural: pluginrepositories
    singular: pluginrepository
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.trusted
      name: Trusted
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PluginRepository is a plugin catalog source.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PluginRepositorySpec is a catalog source.
            properties:
              trusted:
                description: |-
                  Trusted repositories are the only ones whose plugins can be installed
                  and whose UI bundles are served.
                type: boolean
              type:
                description: RepositoryType is where a catalog comes from.
                enum:
                - builtin
                - helm
                - oci
                type: string
              url:
                description: |-
                  URL of a helm or oci repository; empty for builtin (the plugins/
                  directory shipped with Capybara).
                type: string
            required:
            - trusted
            - type
            type: object
          status:
            description: PluginRepositoryStatus is the result of the last sync.
            properties:
              lastSynced:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              plugins:
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
