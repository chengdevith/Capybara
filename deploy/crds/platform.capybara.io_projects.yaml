---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: projects.platform.capybara.io
spec:
  group: platform.capybara.io
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    shortNames:
    - proj
    singular: project
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.size
      name: Size
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Project is a namespace in a managed cluster with a quota preset, limits,
          baseline network policies and an owner group.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProjectSpec is the desired state of a Project.
            properties:
              cluster:
                description: Cluster is the id of the managed cluster the Project
                  lives in.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: cluster cannot be changed
                  rule: self == oldSelf
              description:
                description: Description says what the Project is for.
                maxLength: 1024
                type: string
              displayName:
                description: DisplayName is a human-friendly name.
                maxLength: 128
                type: string
              namespace:
                description: Namespace is created in the cluster for this Project.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: namespace cannot be changed
                  rule: self == oldSelf
              owner:
                description: |-
                  Owner is a group name; it gets the admin role in the namespace
                  (RoleBinding with a Group subject).
                maxLength: 253
                minLength: 1
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]*$
                type: string
              size:
                description: Size is the quota preset.
                enum:
                - S
                - M
                - L
                type: string
            required:
            - cluster
            - namespace
            - owner
            - size
            type: object
          status:
            description: ProjectStatus is the observed state of a Project.
            properties:
              conditions:
                description: 'Conditions: Ready (with a reason) and ClusterReachable.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  describes.
                format: int64
                type: integer
              phase:
                description: Phase summarises the conditions.
                enum:
                - Pending
                - Ready
                - Error
                - Terminating
                type: string
              podSecurity:
                description: |-
                  PodSecurity: the namespace's Pod Security levels and any existing
                  pods that violated them when they were applied.
                properties:
                  checkedAt:
                    description: CheckedAt is when the levels were applied (after
                      a dry run).
                    format: date-time
                    type: string
                  enforce:
                    type: string
                  violations:
                    description: |-
                      Violations are Kubernetes' warnings about pods that existed then and
                      violate the enforced level (at most 50).
                    items:
                      type: string
                    type: array
                  warn:
                    type: string
                required:
                - checkedAt
                - enforce
                - warn
                type: object
              resources:
                description: Resources the controller manages in the cluster.
                items:
                  description: ManagedResource is one resource the controller created
                    in the cluster.
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a DNS label of at most 63 characters
          rule: self.metadata.name.size() <= 63 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
