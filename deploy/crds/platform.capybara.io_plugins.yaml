---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: plugins.platform.capybara.io
spec:
  group: platform.capybara.io
  names:
    kind: Plugin
    listKind: PluginList
    plural: plugins
    singular: plugin
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.repository
      name: Repository
      type: string
    - jsonPath: .status.available
      name: Available
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Plugin is an entry in the plugin catalog.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PluginSpec is a catalog entry, written by the catalog sync from the
              plugin's manifest (plugins/<name>/plugin.yaml).
            properties:
              actions:
                items:
                  description: |-
                    PluginAction is an operation on one of the plugin's resources that core
                    carries out with Capybara's account (holding the console permissions)
                    and audits; plugin code never decides what is written.
                  properties:
                    copyFields:
                      description: 'Copy: dotted field paths copied from the original
                        when present.'
                      items:
                        type: string
                      type: array
                    danger:
                      description: 'Danger: shown in red and confirmed.'
                      type: boolean
                    group:
                      description: The target resource.
                      type: string
                    kind:
                      type: string
                    name:
                      description: Name is the action id (audited as <plugin>.<name>).
                      type: string
                    patch:
                      description: 'Patch: the JSON merge patch.'
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    policy:
                      description: |-
                        Policy the result of a copy must pass (as for objects). Copies are
                        then allowed only in Project namespaces.
                      type: string
                    projectOnly:
                      description: 'ProjectOnly: only in Project namespaces.'
                      type: boolean
                    resource:
                      type: string
                    title:
                      type: string
                    type:
                      description: ActionType is what a declared plugin action does.
                      enum:
                      - copy
                      - patch
                      type: string
                    version:
                      type: string
                    when:
                      description: 'When: only for objects matching this condition.'
                      properties:
                        status:
                          items:
                            type: string
                          type: array
                        type:
                          type: string
                      required:
                      - status
                      - type
                      type: object
                  required:
                  - group
                  - kind
                  - name
                  - resource
                  - title
                  - type
                  - version
                  type: object
                type: array
              backend:
                description: Backend is the plugin backend's name, if it has one.
                type: string
              chart:
                description: ChartRef is a plugin's Helm chart.
                properties:
                  archive:
                    description: Archive path inside the plugin directory.
                    type: string
                  generatedSecrets:
                    description: GeneratedSecrets are created before the chart is
                      installed.
                    items:
                      description: |-
                        GeneratedSecret is a Secret Capybara creates in the plugin's namespace
                        before installing (e.g. an admin password), so secrets never appear in
                        chart values, the installation, audit entries or API responses.
                      properties:
                        keys:
                          items:
                            description: |-
                              GeneratedKey is one key of a generated Secret: a literal value, or a
                              random one (32 bytes, base64url) created once and kept.
                            properties:
                              name:
                                type: string
                              random:
                                type: boolean
                              value:
                                type: string
                            required:
                            - name
                            type: object
                          type: array
                        name:
                          type: string
                      required:
                      - keys
                      - name
                      type: object
                    type: array
                  installValues:
                    description: |-
                      InstallValues are merged over the preset per installation; the
                      string "{{cluster}}" is replaced by the cluster id.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  namespace:
                    type: string
                  namespaceLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      NamespaceLabels are set on the release namespace when the controller
                      creates it (or added when it exists), e.g. a Pod Security level the
                      upstream manifest's own Namespace object carried.
                    type: object
                  refuseInstallOn:
                    description: |-
                      RefuseInstallOn lists platforms where install mode is refused
                      (connect instead), e.g. openshift.
                    items:
                      type: string
                    type: array
                  releaseName:
                    type: string
                  sha256:
                    description: SHA256 of the archive (hex). Verified before every
                      use.
                    type: string
                  values:
                    description: Values file inside the plugin directory (the preset).
                    type: string
                  version:
                    description: Version of the chart, for display and upgrades.
                    type: string
                required:
                - archive
                - namespace
                - releaseName
                - sha256
                - version
                type: object
              configSchema:
                description: ConfigSchema is a JSON Schema (subset) for the installation's
                  config.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              connectNamespaceKey:
                description: |-
                  Namespace for connect mode's backend account when the config does not
                  name one (the namespace of the connected service).
                type: string
              dependencies:
                items:
                  type: string
                type: array
              description:
                type: string
              detect:
                description: |-
                  Detect says what indicates an existing installation of the tool: install
                  mode is refused when found (connect to it instead); connect mode needs it.
                properties:
                  apiResources:
                    description: API resources served by the cluster, as "<group>/<resource>".
                    items:
                      type: string
                    type: array
                  namespaces:
                    description: |-
                      Namespaces that only an existing (e.g. operator-managed) install has.
                      They only refuse install mode.
                    items:
                      type: string
                    type: array
                type: object
              displayName:
                type: string
              extensionApi:
                description: ExtensionAPI is the major extension API version the UI
                  bundle uses.
                type: integer
              extensionPoints:
                items:
                  type: string
                type: array
              icon:
                description: Icon is a small SVG (data URI).
                type: string
              minExtensionApi:
                description: |-
                  MinExtensionAPI is the lowest "1.M" the plugin works with; Capybara
                  refuses it when it provides an older minor version.
                type: string
              modes:
                items:
                  description: InstallMode is how a plugin is attached to a cluster.
                  enum:
                  - install
                  - connect
                  type: string
                minItems: 1
                type: array
              name:
                description: Name is the plugin's name (the Plugin object's name).
                type: string
              objects:
                description: Objects the console may write in Project namespaces.
                items:
                  description: |-
                    PluginObject is a kind the console may create, update or delete in
                    Project namespaces, through core (validated against Policy, dry-run,
                    audited). Plugin code never decides what is written.
                  properties:
                    audit:
                      additionalProperties:
                        type: string
                      description: |-
                        Audit maps a verb to the audited action name (default: the verb);
                        audited as <plugin>.<action>, e.g. create of pipelineruns as "start".
                      type: object
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      description: Name identifies it in the API (usually the plural,
                        e.g. "tasks").
                      type: string
                    policy:
                      description: Policy names an entry of the plugin's policies
                        every write must pass.
                      type: string
                    references:
                      description: |-
                        References are other plugin objects this one names (same
                        namespace). On create they are loaded and must pass their policy.
                      items:
                        description: ObjectReference says the value at Path names
                          an Object in the same namespace.
                        properties:
                          object:
                            type: string
                          path:
                            type: string
                        required:
                        - object
                        - path
                        type: object
                      type: array
                    resource:
                      type: string
                    verbs:
                      items:
                        description: ObjectVerb is a write the console may make on
                          a plugin object.
                        enum:
                        - create
                        - update
                        - delete
                        type: string
                      type: array
                    version:
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  - resource
                  - verbs
                  - version
                  type: object
                type: array
              permissions:
                description: PluginPermissions are everything a plugin may do, shown
                  before install.
                properties:
                  connect:
                    description: Installer credential, connect mode (only the backend's
                      account).
                    properties:
                      clusterRules:
                        description: Cluster-wide rules (a ClusterRole).
                        items:
                          description: |-
                            PolicyRule mirrors an RBAC rule (kept here so this package depends only
                            on apimachinery).
                          properties:
                            apiGroups:
                              items:
                                type: string
                              type: array
                            resourceNames:
                              items:
                                type: string
                              type: array
                            resources:
                              items:
                                type: string
                              type: array
                            verbs:
                              items:
                                type: string
                              type: array
                          required:
                          - verbs
                          type: object
                        type: array
                      namespaceRules:
                        description: Rules in the plugin's namespace (a Role there).
                        items:
                          description: |-
                            PolicyRule mirrors an RBAC rule (kept here so this package depends only
                            on apimachinery).
                          properties:
                            apiGroups:
                              items:
                                type: string
                              type: array
                            resourceNames:
                              items:
                                type: string
                              type: array
                            resources:
                              items:
                                type: string
                              type: array
                            verbs:
                              items:
                                type: string
                              type: array
                          required:
                          - verbs
                          type: object
                        type: array
                    type: object
                  console:
                    description: |-
                      Console is granted to Capybara's own account on the cluster while the
                      plugin is installed (a ClusterRole capybara-plugin-<name>-console), so
                      the console can read the plugin's resources and run its declared
                      actions. Only ClusterRules are used.
                    properties:
                      clusterRules:
                        description: Cluster-wide rules (a ClusterRole).
                        items:
                          description: |-
                            PolicyRule mirrors an RBAC rule (kept here so this package depends only
                            on apimachinery).
                          properties:
                            apiGroups:
                              items:
                                type: string
                              type: array
                            resourceNames:
                              items:
                                type: string
                              type: array
                            resources:
                              items:
                                type: string
                              type: array
                            verbs:
                              items:
                                type: string
                              type: array
                          required:
                          - verbs
                          type: object
                        type: array
                      namespaceRules:
                        description: Rules in the plugin's namespace (a Role there).
                        items:
                          description: |-
                            PolicyRule mirrors an RBAC rule (kept here so this package depends only
                            on apimachinery).
                          properties:
                            apiGroups:
                              items:
                                type: string
                              type: array
                            resourceNames:
                              items:
                                type: string
                              type: array
                            resources:
                              items:
                                type: string
                              type: array
                            verbs:
                              items:
                                type: string
                              type: array
                          required:
                          - verbs
                          type: object
                        type: array
                    type: object
                  install:
                    description: Installer credential, install mode (deploying the
                      chart).
                    properties:
                      clusterRules:
                        description: Cluster-wide rules (a ClusterRole).
                        items:
                          description: |-
                            PolicyRule mirrors an RBAC rule (kept here so this package depends only
                            on apimachinery).
                          properties:
                            apiGroups:
                              items:
                                type: string
                              type: array
                            resourceNames:
                              items:
                                type: string
                              type: array
                            resources:
                              items:
                                type: string
                              type: array
                            verbs:
                              items:
                                type: string
                              type: array
                          required:
                          - verbs
                          type: object
                        type: array
                      namespaceRules:
                        description: Rules in the plugin's namespace (a Role there).
                        items:
                          description: |-
                            PolicyRule mirrors an RBAC rule (kept here so this package depends only
                            on apimachinery).
                          properties:
                            apiGroups:
                              items:
                                type: string
                              type: array
                            resourceNames:
                              items:
                                type: string
                              type: array
                            resources:
                              items:
                                type: string
                              type: array
                            verbs:
                              items:
                                type: string
                              type: array
                          required:
                          - verbs
                          type: object
                        type: array
                    type: object
                  project:
                    description: |-
                      Project is granted to Capybara's own account in each Project namespace
                      of a cluster where the plugin is installed: a ClusterRole
                      capybara-plugin-<name>-project, bound there by a RoleBinding of the
                      same name. It also creates the listed ServiceAccounts there.
                    properties:
                      rules:
                        description: Rules granted to Capybara's account in each Project
                          namespace.
                        items:
                          description: |-
                            PolicyRule mirrors an RBAC rule (kept here so this package depends only
                            on apimachinery).
                          properties:
                            apiGroups:
                              items:
                                type: string
                              type: array
                            resourceNames:
                              items:
                                type: string
                              type: array
                            resources:
                              items:
                                type: string
                              type: array
                            verbs:
                              items:
                                type: string
                              type: array
                          required:
                          - verbs
                          type: object
                        type: array
                      serviceAccounts:
                        description: |-
                          ServiceAccounts created in each Project namespace, with no
                          permissions of their own.
                        items:
                          description: ProjectServiceAccount is a ServiceAccount a
                            plugin creates per Project.
                          properties:
                            automountToken:
                              description: 'AutomountToken: whether pods using it
                                get an API token (default no).'
                              type: boolean
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                    required:
                    - rules
                    type: object
                  services:
                    description: |-
                      What the plugin backend may reach in a cluster where the plugin is
                      installed and enabled.
                    items:
                      description: |-
                        ServiceAccess is one cluster service a plugin's backend (or its UI,
                        through the backend) may reach via the Kubernetes service proxy.
                      properties:
                        methods:
                          description: HTTP methods allowed.
                          items:
                            type: string
                          type: array
                        modes:
                          description: 'Modes this access applies to (default: all).'
                          items:
                            description: InstallMode is how a plugin is attached to
                              a cluster.
                            enum:
                            - install
                            - connect
                            type: string
                          type: array
                        name:
                          description: Name the backend uses for it, e.g. "prometheus".
                          type: string
                        namespace:
                          description: |-
                            Namespace and Service in install mode. In connect mode they come from
                            the installation's config (keys namespaceKey/serviceKey).
                          type: string
                        namespaceKey:
                          description: Config keys holding namespace, service and
                            port in connect mode.
                          type: string
                        paths:
                          description: |-
                            Path prefixes allowed (after the service proxy prefix). "*" matches
                            one path segment.
                          items:
                            type: string
                          type: array
                        port:
                          description: Port name or number ("http-web", "9090"); "https:<port>"
                            for TLS.
                          type: string
                        portKey:
                          type: string
                        service:
                          type: string
                        serviceKey:
                          type: string
                        writePaths:
                          description: |-
                            WritePaths are the only path prefixes allowed for methods other than
                            GET and HEAD (default: Paths).
                          items:
                            type: string
                          type: array
                      required:
                      - methods
                      - name
                      - paths
                      type: object
                    type: array
                type: object
              policies:
                additionalProperties:
                  description: ObjectPolicy is a closed set of rules over an object's
                    fields.
                  properties:
                    include:
                      description: Include other policies' rules first.
                      items:
                        type: string
                      type: array
                    rules:
                      items:
                        description: |-
                          ObjectRule applies to every value matching Path: dotted segments, "*"
                          any map key or list element, "**" any depth (zero or more levels).
                          Exactly one of Deny, Allow, Default, AllowKeys/ExactlyOneOf, WithinQuota
                          or CountQuota is set.
                        properties:
                          allow:
                            description: 'Allow: a match must be one of these values.'
                            items:
                              type: string
                            type: array
                          allowKeys:
                            description: |-
                              AllowKeys/ExactlyOneOf: a match is a map with only these keys, and
                              exactly one of ExactlyOneOf.
                            items:
                              type: string
                            type: array
                          countQuota:
                            description: 'CountQuota: the number of matches must fit
                              within this quota resource.'
                            type: string
                          default:
                            description: 'Default: set this value when the (exact)
                              path is absent.'
                            type: string
                          deny:
                            description: 'Deny: a match is a violation (only when
                              it equals Equals, if set).'
                            type: boolean
                          equals:
                            type: string
                          exactlyOneOf:
                            items:
                              type: string
                            type: array
                          message:
                            description: Message shown for a violation.
                            type: string
                          path:
                            type: string
                          withinQuota:
                            description: |-
                              WithinQuota: the matches (quantities) must sum to within what the
                              namespace's ResourceQuotas still allow for this resource.
                            type: string
                        required:
                        - path
                        type: object
                      type: array
                  required:
                  - rules
                  type: object
                description: Policies referenced by objects (and actions), by name.
                type: object
              repository:
                type: string
              scope:
                enum:
                - per-cluster
                - global
                type: string
              steps:
                items:
                  description: InstallStep is one stage shown while installing.
                  properties:
                    check:
                      description: StepCheck is how the controller decides a step
                        is done.
                      properties:
                        contains:
                          type: string
                        kind:
                          description: 'workload: kind and name; apiResource: "<group>/<resource>"
                            in Name.'
                          type: string
                        name:
                          type: string
                        namespace:
                          description: 'workload/dryRun: namespace (default: the plugin
                            namespace).'
                          type: string
                        object:
                          description: 'dryRun: the object to create (dry run, with
                            Capybara''s account).'
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        path:
                          type: string
                        service:
                          description: |-
                            service: the ServiceAccess name, a GET path, and a substring the
                            response must contain.
                          type: string
                        type:
                          description: |-
                            helm (the release is deployed), workload (a Deployment/StatefulSet/
                            DaemonSet is ready), service (a declared service answers a path),
                            apiResource (the cluster serves "<group>/<resource>", e.g. after its
                            CRD is established), dryRun (the API server accepts Object in a
                            server-side dry run, e.g. through the plugin's webhooks).
                          enum:
                          - helm
                          - workload
                          - service
                          - apiResource
                          - dryRun
                          type: string
                      required:
                      - type
                      type: object
                    modes:
                      description: 'Modes the step applies to (default: all).'
                      items:
                        description: InstallMode is how a plugin is attached to a
                          cluster.
                        enum:
                        - install
                        - connect
                        type: string
                      type: array
                    name:
                      type: string
                    title:
                      type: string
                  required:
                  - check
                  - name
                  - title
                  type: object
                type: array
              ui:
                description: UIBundle is a plugin's browser code.
                properties:
                  bundle:
                    description: Bundle path inside the plugin directory (an ES module).
                    type: string
                  sha256:
                    description: SHA256 of the bundle (hex). Bundles are served only
                      when it matches.
                    type: string
                required:
                - bundle
                - sha256
                type: object
              version:
                type: string
            required:
            - displayName
            - extensionApi
            - modes
            - repository
            - scope
            - version
            type: object
          status:
            description: PluginStatus says whether the entry can be installed.
            properties:
              available:
                description: |-
                  Available is false when the manifest, an archive or a hash is wrong,
                  or the repository is untrusted; Problem says why.
                type: boolean
              problem:
                type: string
              syncedAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
