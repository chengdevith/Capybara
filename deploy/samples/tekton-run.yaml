# A run of the sample Pipeline (deploy/samples/tekton-pipeline.yaml), in the
# same Project namespace. Use kubectl create (generateName):
#   make kubectl CLUSTER=dev-1 ARGS="create -n ci-demo -f deploy/samples/tekton-run.yaml"
# Runs started from Capybara use the Project's "pipeline" ServiceAccount.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: hello-
spec:
  pipelineRef:
    name: hello
  taskRunTemplate:
    serviceAccountName: pipeline
  params:
    - name: who
      value: Capybara
