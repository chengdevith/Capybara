# Sample for the Pipelines (Tekton) plugin, for a Project namespace (Capybara
# writes Tekton objects only in Projects; make demo imports busybox:1.36).
# Apply it into your Project's namespace, e.g. "ci-demo":
#   make kubectl CLUSTER=dev-1 ARGS="apply -n ci-demo -f deploy/samples/tekton-pipeline.yaml"
# Then start runs from the Pipeline's page (Actions -> Start run), or:
#   make kubectl CLUSTER=dev-1 ARGS="create -n ci-demo -f deploy/samples/tekton-run.yaml"
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: hello
spec:
  description: Says hello, then works for a few seconds (pass seconds=300 for a run to cancel).
  params:
    - name: who
      type: string
      default: Capybara
    - name: seconds
      type: string
      default: "5"
  tasks:
    - name: greet
      params:
        - name: who
          value: $(params.who)
      taskSpec:
        params:
          - name: who
        steps:
          - name: say-hello
            image: busybox:1.36
            script: |
              #!/bin/sh
              echo "Hello, $(params.who)!"
    - name: work
      runAfter: [greet]
      params:
        - name: seconds
          value: $(params.seconds)
      taskSpec:
        params:
          - name: seconds
        steps:
          - name: count
            image: busybox:1.36
            script: |
              #!/bin/sh
              n=$(params.seconds)
              i=1
              while [ "$i" -le "$n" ]; do echo "working $i/$n"; sleep 1; i=$((i + 1)); done
              echo done
