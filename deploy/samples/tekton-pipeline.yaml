# Sample for the Pipelines (Tekton) plugin, in the demo namespace (make demo
# first: it creates capybara-demo and imports busybox:1.36). Apply:
#   make kubectl CLUSTER=dev-1 ARGS="apply -f deploy/samples/tekton-pipeline.yaml"
# Start more runs with: make kubectl CLUSTER=dev-1 ARGS="create -f deploy/samples/tekton-run.yaml"
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: hello
  namespace: capybara-demo
spec:
  description: Says hello, then works for a few seconds (pass seconds=300 for a run to cancel).
  params:
    - name: who
      type: string
      default: Capybara
    - name: seconds
      type: string
      default: "5"
  tasks:
    - name: greet
      params:
        - name: who
          value: $(params.who)
      taskSpec:
        params:
          - name: who
        steps:
          - name: say-hello
            image: busybox:1.36
            script: |
              #!/bin/sh
              echo "Hello, $(params.who)!"
    - name: work
      runAfter: [greet]
      params:
        - name: seconds
          value: $(params.seconds)
      taskSpec:
        params:
          - name: seconds
        steps:
          - name: count
            image: busybox:1.36
            script: |
              #!/bin/sh
              n=$(params.seconds)
              i=1
              while [ "$i" -le "$n" ]; do echo "working $i/$n"; sleep 1; i=$((i + 1)); done
              echo done
