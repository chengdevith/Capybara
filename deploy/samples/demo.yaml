# Demo workload for exercising the console: live lists, logs, and (Phase 2)
# scale/restart/delete. Applied to capybara-dev-1 and capybara-dev-2 by
# `make demo`, removed by `make demo-clean`.
#
# The image is pinned and imported into the clusters by `make demo`
# (k3d image import), so nodes never pull it themselves.
apiVersion: v1
kind: Namespace
metadata:
  name: capybara-demo
  labels:
    app.kubernetes.io/part-of: capybara-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-logger
  namespace: capybara-demo
  labels:
    app.kubernetes.io/name: demo-logger
    app.kubernetes.io/part-of: capybara-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-logger
        app.kubernetes.io/part-of: capybara-demo
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'echo "$(date -Iseconds) $HOSTNAME stopping"; exit 0' TERM
              mkdir -p /tmp/www && echo "hello from $HOSTNAME" > /tmp/www/index.html
              httpd -p 8080 -h /tmp/www
              i=0
              while true; do
                i=$((i + 1))
                echo "$(date -Iseconds) $HOSTNAME tick $i"
                sleep 3
              done
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-logger
  namespace: capybara-demo
  labels:
    app.kubernetes.io/name: demo-logger
    app.kubernetes.io/part-of: capybara-demo
spec:
  selector:
    app.kubernetes.io/name: demo-logger
  ports:
    - name: http
      port: 80
      targetPort: http
